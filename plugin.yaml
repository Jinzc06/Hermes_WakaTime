name: wakatime
version: "1.1.0"
kind: standalone
description: "WakaTime heartbeats for Hermes Agent — reads your key from ~/.wakatime.cfg (standard WakaTime config) or env vars, tracks coding time, projects, languages, and files on wakatime.com or any WakaTime-compatible server (wakapi, Hackatime). Opt-in via `hermes plugins enable wakatime`."
author: Jinzc06
provides_hooks:
  - on_session_start
  - post_tool_call
  - post_llm_call
  - on_session_end

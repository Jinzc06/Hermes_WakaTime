name: wakatime
version: "1.0.0"
kind: standalone
description: "WakaTime heartbeats for Hermes Agent — tracks coding time, projects, languages, and files on wakatime.com or any WakaTime-compatible server (wakapi, Hackatime). Opt-in via `hermes plugins enable wakatime`."
author: Jinzc06
requires_env:
  - WAKATIME_API_KEY
provides_hooks:
  - on_session_start
  - post_tool_call
  - post_llm_call
  - on_session_end
